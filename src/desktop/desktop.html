<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>theHunterWIKI - Desktop</title>
    <link rel="stylesheet" href="../../css/style.css" />
  </head>
  <body class="dark-theme">
    <div id="window-header" class="window-header">
      <div class="logo">theHunter<span>WIKI</span></div>
      <div class="window-controls">
        <button id="minimizeButton" class="control-btn minimize">_</button>
        <button id="closeButton" class="control-btn close">×</button>
      </div>
    </div>

    <header>
      <div class="search-wrapper">
        <input type="text" id="search-bar" placeholder="Search an animal..." />
        <div id="search-results" class="search-dropdown hidden"></div>
      </div>
      <div class="status-container">
        <a id="bug-report-link" class="hotkey-link" title="Report a Bug">
          <img src="../../img/icons/bug.png" alt="Bug" class="settings-icon" />
        </a>
        <a id="hotkey-link" class="hotkey-link" title="Change Hotkey">
          <img src="../../img/icons/settings.png" alt="Settings" class="settings-icon" />
        </a>
      </div>
    </header>

    <main>
      <div id="desktop-notification" class="desktop-notification">
        <p><strong>theHunter: Call of the Wild</strong> is not running.</p>
        <p>Launch the game to use the wiki in-game with <span class="hotkey-display">CTRL + B</span>.</p>
      </div>

      <section id="view-home" class="view active">
        <div class="maps-grid" id="maps-container"></div>
      </section>

      <section id="view-map" class="view hidden">
        <div class="view-header">
          <button id="btn-back-home" class="btn-back">⬅ Maps</button>
          <h2 id="current-map-title">Map Name</h2>
        </div>
        <div class="animals-grid" id="map-animals-container"></div>
      </section>

      <section id="view-animal" class="view hidden">
        <button id="btn-back-map" class="btn-back">⬅ Back</button>
        <div id="animal-detail-content" class="animal-detail"></div>
      </section>
    </main>

    <footer class="ad-footer">
      <div id="ad-container" class="ad-banner-container">
        <div class="ad-placeholder">Advertisement</div>
      </div>
    </footer>
  </body>
</html>
